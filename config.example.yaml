# ACL 插件（角色、范围与配额）。角色可为 guest、user、admin、superuser。
acl:
  # 空列表表示不限制群；填写 QQ 群号可启用群白名单。
  acl_allowed_groups: []
  # 是否允许私聊触发业务命令；此项对所有角色生效。
  acl_allow_private: false
  # 静态管理员、用户白名单和黑名单 QQ 号列表。
  acl_admins: []
  acl_user_whitelist: []
  acl_blacklist: []
  # 每项的 name 必须是已加载插件注册的命令名，不能重复；这里只写覆盖项，
  # 未列出的命令使用插件声明的默认角色/配额。quota_daily、
  # rate_limit_per_minute、cooldown 分别代表每日配额、跨用户每分钟请求上限
  # 和个人冷却秒数；0 均表示不限制。
  plugins:
    - name: jrrp
      permission: guest
    - name: genai
      permission: user
      quota_daily: 20
      rate_limit_per_minute: 0
      cooldown: 10
    - name: eh
      permission: admin
      quota_daily: 20
      rate_limit_per_minute: 0
      cooldown: 10
    - name: imgsearch
      permission: user
      quota_daily: 20
      rate_limit_per_minute: 0
      cooldown: 10
    - name: agent
      permission: user
      quota_daily: 20
      rate_limit_per_minute: 0
      cooldown: 10
    - name: parser
      permission: user
    - name: health
      permission: superuser
    - name: auth
      permission: admin

# 链接解析插件。cookie 仅填写本地 config.yaml，更新后需重启机器人。
media_parser:
  # Bilibili、小红书、YouTube 和音乐平台 cookie；没有则保持空字符串。
  parser_bili_ck: ""
  parser_xhs_ck: ""
  parser_ytb_ck: ""
  parser_ytmusic_ck: ""
  parser_spotify_ck: ""
  parser_netease_music_ck: ""
  parser_qq_music_ck: ""
  # 是否上传音频文件，以及是否将媒体编码为 base64 发送。
  parser_need_upload: false
  parser_use_base64: false
  # 单位分别为 MB 和秒。
  parser_max_size: 20
  parser_duration_maximum: 120
  # 下载媒体时验证 TLS 证书；仅当 CDN 证书不兼容时才设为 false（会削弱传输安全）。
  parser_verify_ssl: true
  # 禁用的平台列表。核心部署默认关闭需境外网络或登录态的平台。
  parser_disabled_platforms: [youtube, tiktok, twitter, nga]
  # 是否以合并转发消息发送媒体内容。
  parser_need_forward_contents: true
  # 解析任务队列：限制同时处理的任务数，避免短时间大量并发。
  parser_max_concurrency: 2
  # 等待队列长度，0 表示不限制。
  parser_queue_size: 32
  # 临时性错误（网络超时/5xx/风控等）的重试次数与首次重试等待秒数（之后指数退避）。
  parser_max_retries: 2
  parser_retry_delay: 1.0

# 健康检查插件
health:
  # 前端 HTTP 探测超时，单位为秒。
  health_http_timeout: 5.0

# AI 图检测插件。凭证从 Sightengine 控制台获取。
genai_detect:
  sightengine_api_user: ""
  sightengine_api_secret: ""
  # 全局 C2PA 检测的图片下载超时（秒）和单图最大字节数；仅校验内嵌凭证。
  c2pa_timeout: 15
  c2pa_max_file_size: 8388608
  # 官方签名与 TSA 信任列表的刷新间隔（秒）。
  c2pa_trust_list_refresh: 86400

# ExHentai 搜索插件。填入浏览器 cookie 对应的值。
ehsearch:
  eh_ipb_member_id: ""
  eh_ipb_pass_hash: ""
  eh_sk: ""
  eh_igneous: ""

# 反向搜图插件
imgsearch:
  # 上游请求超时（秒）、可接受文件最大字节数和单个上游返回结果数。
  imgsearch_timeout: 30
  imgsearch_max_file_size: 8388608
  imgsearch_result_limit: 5
  # 最低相似度百分比，0 表示不筛选。
  imgsearch_similarity_threshold: 0
  # 可选 SauceNAO API Key。
  imgsearch_saucenao_api_key: ""
  # Soutubot 搜索灵敏度系数。
  imgsearch_soutubot_factor: 1.2

# Hermes Agent 插件。API Key 只写入本地 config.yaml。
agent:
  # Hermes Gateway 地址；profile 会走 /p/<profile> 前缀。
  agent_endpoint: http://hermes-agent:8642
  # 默认 profile 的 API Key。
  agent_api_key: ""
  # 未指定 @profile 时使用的 profile；空或 default 表示默认 profile。
  agent_default_profile: ""
  # 命名 profile 的独立 API Key；Hermes 的命名 profile 不会继承默认 Key。
  agent_profiles: {}
  # 单轮请求、同会话排队、QQ 分段与引用内容的限制。
  agent_timeout: 300
  agent_lock_timeout: 30
  agent_outgoing_max_chars: 1800
  agent_reference_max_chars: 12000
  agent_file_max_bytes: 8388608
  agent_image_max_bytes: 4194304
  agent_max_attachments: 4
  # 可选：把二进制附件写入一个 Hermes 也能看到的共享目录。
  agent_upload_dir: ""
  agent_remote_upload_dir: ""
  # 可选：消息与会话映射数据库；空表示使用 localstore。
  agent_db_path: ""
