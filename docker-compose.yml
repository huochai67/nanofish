x-config-host: &config-host ${HOST:-0.0.0.0}
x-config-port: &config-port ${PORT:-8080}

services:
  nanofish-frontend:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    restart: always

  nanofish:
    build: .
    ports:
      - *config-port
    env_file:
      - .env.prod
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    environment:
      ENVIRONMENT: prod
      HOST: *config-host
      PORT: *config-port
      # Reach Next.js on the compose network (overrides .env.prod if set)
      APP_API_BASE: http://nanofish-frontend:3000
    depends_on:
      - nanofish-frontend
    restart: always
